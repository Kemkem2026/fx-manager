<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="外貨管理">
<title>外貨管理</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0e1419;
    --surface2: #151c24;
    --border: rgba(100,180,255,0.12);
    --accent: #38bdf8;
    --accent2: #0ea5e9;
    --green: #4ade80;
    --gold: #fbbf24;
    --red: #f87171;
    --text: #e2eaf4;
    --muted: #64748b;
    --muted2: #94a3b8;
    --radius: 10px;
    --font-mono: 'DM Mono', monospace;
    --font-jp: 'Noto Sans JP', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-jp);
    min-height: 100vh;
    padding-bottom: 90px;
    overscroll-behavior: none;
  }

  /* Background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 80% 10%, rgba(56,189,248,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 10% 80%, rgba(74,222,128,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8,12,16,0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-box {
    background: var(--accent);
    color: #000;
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 13px;
    padding: 4px 8px;
    letter-spacing: 1px;
  }
  .app-title { font-size: 16px; font-weight: 900; letter-spacing: 1px; }
  .app-sub { font-size: 9px; color: var(--accent); letter-spacing: 3px; font-family: var(--font-mono); }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .refresh-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .refresh-btn:active { background: var(--accent); color: #000; }
  .updated-at { font-size: 10px; color: var(--muted); font-family: var(--font-mono); }

  /* Grand total bar */
  .grand-bar {
    background: linear-gradient(135deg, rgba(56,189,248,0.1), rgba(74,222,128,0.06));
    border: 1px solid rgba(56,189,248,0.25);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 12px 12px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .grand-label { font-size: 10px; color: var(--accent); letter-spacing: 3px; font-family: var(--font-mono); margin-bottom: 2px; }
  .grand-jpy { font-size: 28px; font-weight: 900; font-family: var(--font-mono); letter-spacing: -1px; }
  .grand-usd { font-size: 12px; color: var(--muted2); font-family: var(--font-mono); }

  /* Tabs */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: rgba(8,12,16,0.6);
    margin-top: 12px;
  }
  .tab {
    flex: 1;
    padding: 11px 0;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--font-jp);
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(56,189,248,0.04); }

  /* Content */
  .content { padding: 14px 12px; position: relative; z-index: 1; }

  /* Currency cards */
  .currency-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .currency-card:active { border-color: rgba(56,189,248,0.3); }
  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .card-flag { font-size: 22px; line-height: 1; }
  .card-info { flex: 1; }
  .card-code { font-size: 15px; font-weight: 900; font-family: var(--font-mono); letter-spacing: 1px; }
  .card-name { font-size: 11px; color: var(--muted2); margin-top: 1px; }
  .card-pct {
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .card-body { padding: 12px 14px; }
  .card-amount { font-size: 24px; font-weight: 900; font-family: var(--font-mono); letter-spacing: -0.5px; margin-bottom: 2px; }
  .card-jpy { font-size: 13px; color: var(--muted2); margin-bottom: 4px; }
  .card-rate { font-size: 10px; color: var(--muted); font-family: var(--font-mono); margin-bottom: 10px; }
  .progress-bg { height: 3px; background: rgba(255,255,255,0.07); border-radius: 2px; margin-bottom: 10px; }
  .progress-fill { height: 3px; border-radius: 2px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }
  .bills-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .bill-chip {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--muted2);
    font-family: var(--font-mono);
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: rgba(8,12,16,0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 200;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1;
    padding: 10px 0 8px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--font-jp);
    font-size: 11px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: color 0.2s;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-icon { font-size: 20px; }

  /* Detail view */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .section-title { font-size: 11px; color: var(--accent); letter-spacing: 3px; font-family: var(--font-mono); }
  .section-total { font-size: 13px; font-weight: 700; font-family: var(--font-mono); }
  .section-jpy { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

  /* Bill table */
  .bill-table { width: 100%; border-collapse: collapse; }
  .bill-table th {
    padding: 6px 10px;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    font-family: var(--font-mono);
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .bill-table td { padding: 9px 10px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .bill-table tr:last-child td { border-bottom: none; }
  .denom-cell { font-family: var(--font-mono); font-weight: 500; }
  .subtotal-cell { font-family: var(--font-mono); color: var(--muted2); }

  /* Count stepper */
  .stepper { display: flex; align-items: center; gap: 0; }
  .step-btn {
    width: 32px; height: 32px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    transition: background 0.15s;
    font-family: var(--font-mono);
  }
  .step-btn:active { background: var(--accent); color: #000; border-color: var(--accent); }
  .step-input {
    width: 52px;
    height: 32px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-left: none; border-right: none;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    text-align: center;
    outline: none;
  }

  /* Action buttons */
  .action-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px;
    border-radius: 4px;
    transition: background 0.15s;
    font-size: 16px;
    color: var(--muted2);
  }
  .action-btn:active { background: rgba(255,255,255,0.08); }
  .action-btn.danger { color: var(--red); }

  /* Add bill row */
  .add-denom-section {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .add-denom-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; font-family: var(--font-mono); }
  .denom-btn {
    background: rgba(56,189,248,0.08);
    border: 1px solid rgba(56,189,248,0.2);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .denom-btn:active { background: var(--accent); color: #000; }
  .denom-input-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 6px;
    width: 100%;
  }
  .denom-custom-input {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 4px;
    outline: none;
  }
  .confirm-btn {
    background: var(--accent);
    border: none;
    color: #000;
    font-family: var(--font-jp);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
  }

  /* Rates */
  .rate-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .rate-flag { font-size: 20px; }
  .rate-code { font-family: var(--font-mono); font-weight: 700; font-size: 15px; width: 40px; }
  .rate-eq { font-size: 13px; color: var(--muted); margin: 0 4px; }
  .rate-input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 16px;
    padding: 8px 10px;
    border-radius: 4px;
    outline: none;
  }
  .rate-input:focus { border-color: var(--accent); }
  .rate-jpy-label { font-size: 12px; color: var(--muted); }
  .rate-result { font-size: 11px; color: var(--green); font-family: var(--font-mono); margin-top: 4px; }

  /* Add currency modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    display: flex;
    align-items: flex-end;
    backdrop-filter: blur(4px);
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    width: 100%;
    padding: 20px 16px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  .modal-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; margin-bottom: 16px; color: var(--accent); font-family: var(--font-mono); }
  .form-row { margin-bottom: 12px; }
  .form-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-bottom: 5px; font-family: var(--font-mono); }
  .form-input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 4px;
    outline: none;
  }
  .form-input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .cancel-btn {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted2);
    font-family: var(--font-jp);
    font-size: 14px;
    padding: 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  .submit-btn {
    flex: 2;
    background: var(--accent);
    border: none;
    color: #000;
    font-family: var(--font-jp);
    font-size: 14px;
    font-weight: 700;
    padding: 12px;
    border-radius: 4px;
    cursor: pointer;
  }

  /* Color presets */
  .color-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .color-swatch.selected { border-color: #fff; transform: scale(1.15); }

  /* Suggested currencies */
  .suggest-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .suggest-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .suggest-btn:active { background: var(--accent); color: #000; border-color: var(--accent); }

  /* Toast */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: #000;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 20px;
    z-index: 500;
    opacity: 0;
    transition: opacity 0.3s;
    letter-spacing: 1px;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* Delete zone */
  .delete-currency-btn {
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.2);
    color: var(--red);
    font-family: var(--font-jp);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    margin: 8px 14px 12px;
    display: block;
    width: calc(100% - 28px);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 0; }

  /* Error */
  .error-bar {
    background: rgba(248,113,113,0.15);
    color: var(--red);
    font-size: 11px;
    padding: 6px 16px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-brand">
      <div class="logo-box">FX</div>
      <div>
        <div class="app-title">外貨管理</div>
        <div class="app-sub">FOREIGN CURRENCY TRACKER</div>
      </div>
    </div>
    <div class="header-actions">
      <span class="updated-at" id="updatedAt"></span>
      <button class="refresh-btn" onclick="fetchRates()" id="refreshBtn">⟳ 更新</button>
    </div>
  </div>
  <div class="grand-bar" id="grandBar">
    <div>
      <div class="grand-label">TOTAL ASSETS</div>
      <div class="grand-jpy" id="grandJPY">—</div>
      <div class="grand-usd" id="grandUSD">—</div>
    </div>
  </div>
</div>

<div id="errorBar" class="error-bar" style="display:none"></div>

<div class="tabs" id="mainTabs" style="display:none">
  <button class="tab active" onclick="switchTab('dashboard')">サマリー</button>
  <button class="tab" onclick="switchTab('detail')">明細</button>
  <button class="tab" onclick="switchTab('rates')">レート</button>
</div>

<div id="dashboard" class="content"></div>
<div id="detail" class="content" style="display:none"></div>
<div id="rates" class="content" style="display:none"></div>

<div class="bottom-nav">
  <button class="nav-btn active" id="nav-dashboard" onclick="switchTab('dashboard')">
    <span class="nav-icon">💹</span>サマリー
  </button>
  <button class="nav-btn" id="nav-detail" onclick="switchTab('detail')">
    <span class="nav-icon">📋</span>明細
  </button>
  <button class="nav-btn" id="nav-rates" onclick="switchTab('rates')">
    <span class="nav-icon">🔄</span>レート
  </button>
  <button class="nav-btn" onclick="openAddCurrency()">
    <span class="nav-icon">＋</span>通貨追加
  </button>
</div>

<!-- Add Currency Modal -->
<div class="modal-overlay" id="addModal" style="display:none" onclick="closeModalOnOverlay(event)">
  <div class="modal">
    <div class="modal-title">＋ 通貨を追加</div>
    <div class="form-row">
      <div class="form-label">よく使われる通貨</div>
      <div class="suggest-row" id="suggestRow"></div>
    </div>
    <div class="form-row">
      <div class="form-label">通貨コード (例: CHF)</div>
      <input class="form-input" id="newCode" maxlength="4" placeholder="USD" style="text-transform:uppercase">
    </div>
    <div class="form-row">
      <div class="form-label">通貨名 (例: スイスフラン)</div>
      <input class="form-input" id="newName" placeholder="スイスフラン">
    </div>
    <div class="form-row">
      <div class="form-label">記号 (例: Fr)</div>
      <input class="form-input" id="newSymbol" maxlength="3" placeholder="Fr">
    </div>
    <div class="form-row">
      <div class="form-label">国旗絵文字</div>
      <input class="form-input" id="newFlag" maxlength="4" placeholder="🇨🇭">
    </div>
    <div class="form-row">
      <div class="form-label">カラー</div>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
      <button class="submit-btn" onclick="addCurrency()">追加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
const DEFAULT_DATA = {
  holdings: {
    USD: { label: "USドル", symbol: "$", flag: "🇺🇸", color: "#4ade80",
      bills: [{denom:5,count:14},{denom:10,count:49},{denom:20,count:35},{denom:50,count:1},{denom:100,count:16}] },
    GBP: { label: "英ポンド", symbol: "£", flag: "🇬🇧", color: "#60a5fa",
      bills: [{denom:10,count:25},{denom:20,count:42},{denom:50,count:1}] },
    EUR: { label: "ユーロ", symbol: "€", flag: "🇪🇺", color: "#fbbf24",
      bills: [{denom:100,count:1}] },
  },
  rates: { USD: 155.0, GBP: 196.0, EUR: 168.0 },
  ratesUpdated: null,
  order: ["USD","GBP","EUR"]
};

const COLORS = ["#4ade80","#60a5fa","#fbbf24","#f472b6","#a78bfa","#fb923c","#34d399","#f87171","#38bdf8","#e879f9"];
const SUGGEST = [
  {code:"AUD",label:"豪ドル",symbol:"A$",flag:"🇦🇺"},
  {code:"CAD",label:"カナダドル",symbol:"C$",flag:"🇨🇦"},
  {code:"CHF",label:"スイスフラン",symbol:"Fr",flag:"🇨🇭"},
  {code:"CNY",label:"人民元",symbol:"¥",flag:"🇨🇳"},
  {code:"HKD",label:"香港ドル",symbol:"HK$",flag:"🇭🇰"},
  {code:"SGD",label:"シンガポールドル",symbol:"S$",flag:"🇸🇬"},
  {code:"KRW",label:"ウォン",symbol:"₩",flag:"🇰🇷"},
  {code:"THB",label:"バーツ",symbol:"฿",flag:"🇹🇭"},
  {code:"TWD",label:"台湾ドル",symbol:"NT$",flag:"🇹🇼"},
  {code:"NZD",label:"NZドル",symbol:"NZ$",flag:"🇳🇿"},
];

let state = loadState();
let currentTab = "dashboard";
let selectedColor = COLORS[0];

function loadState() {
  try {
    const saved = localStorage.getItem("fx_manager_v2");
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveState() {
  localStorage.setItem("fx_manager_v2", JSON.stringify(state));
}

// ===== CALC =====
function getTotal(code) {
  return (state.holdings[code]?.bills || []).reduce((s,b) => s + b.denom * b.count, 0);
}
function getTotalJPY(code) {
  return getTotal(code) * (state.rates[code] || 0);
}
function getTotalUSD(code) {
  if (!state.rates.USD) return 0;
  return getTotal(code) * ((state.rates[code] || 0) / state.rates.USD);
}
function grandJPY() {
  return state.order.reduce((s,c) => s + getTotalJPY(c), 0);
}
function grandUSD() {
  return state.order.reduce((s,c) => s + getTotalUSD(c), 0);
}
function fmtJPY(n) { return "¥" + Math.round(n).toLocaleString("ja-JP"); }
function fmtFX(n, d=2) { return n.toLocaleString("en-US", {minimumFractionDigits:d,maximumFractionDigits:d}); }

// ===== FETCH RATES =====
async function fetchRates() {
  const btn = document.getElementById("refreshBtn");
  btn.textContent = "取得中…";
  btn.disabled = true;
  hideError();
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 500,
        tools: [{type:"web_search_20250305",name:"web_search"}],
        messages: [{
          role: "user",
          content: `現在の為替レートを検索して、以下の通貨の対円レートをJSONのみで返してください。コードは ${state.order.join(",")} です。例: {"USD":155.23,"GBP":195.50,"EUR":168.10,...} マークダウンや説明文は不要です。`
        }]
      })
    });
    const data = await res.json();
    const text = data.content.map(b => b.type==="text" ? b.text : "").join("");
    const match = text.match(/\{[\s\S]*?\}/);
    if (match) {
      const parsed = JSON.parse(match[0]);
      state.order.forEach(code => {
        if (parsed[code]) state.rates[code] = parsed[code];
      });
      state.ratesUpdated = new Date().toISOString();
      saveState();
      showToast("レート更新完了");
    } else {
      throw new Error("parse error");
    }
  } catch(e) {
    showError("レート取得失敗。手動で設定してください。");
  }
  btn.textContent = "⟳ 更新";
  btn.disabled = false;
  renderAll();
}

// ===== RENDER =====
function renderAll() {
  renderGrand();
  renderDashboard();
  renderDetail();
  renderRates();
}

function renderGrand() {
  const jpy = grandJPY();
  const usd = grandUSD();
  document.getElementById("grandJPY").textContent = jpy ? fmtJPY(jpy) : "—";
  document.getElementById("grandUSD").textContent = usd ? `≈ $${fmtFX(usd)} USD` : "";
  if (state.ratesUpdated) {
    const d = new Date(state.ratesUpdated);
    document.getElementById("updatedAt").textContent = d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  }
  document.getElementById("mainTabs").style.display = "flex";
}

function renderDashboard() {
  const el = document.getElementById("dashboard");
  const total = grandJPY();
  el.innerHTML = state.order.map(code => {
    const info = state.holdings[code];
    const amt = getTotal(code);
    const jpy = getTotalJPY(code);
    const pct = total > 0 ? (jpy / total * 100) : 0;
    const rate = state.rates[code];
    const activeBills = info.bills.filter(b => b.count > 0);
    return `<div class="currency-card" style="border-color:${info.color}22">
      <div class="card-head">
        <div class="card-flag">${info.flag}</div>
        <div class="card-info">
          <div class="card-code" style="color:${info.color}">${code}</div>
          <div class="card-name">${info.label}</div>
        </div>
        <div class="card-pct" style="background:${info.color}18;color:${info.color}">${pct.toFixed(1)}%</div>
      </div>
      <div class="card-body">
        <div class="card-amount"><span style="color:${info.color}">${info.symbol}</span>${amt.toLocaleString()}</div>
        <div class="card-jpy">${jpy ? fmtJPY(jpy) : "—"}</div>
        <div class="card-rate">${rate ? `1${info.symbol} = ¥${fmtFX(rate)}` : "レート未設定"}</div>
        <div class="progress-bg"><div class="progress-fill" style="width:${pct}%;background:${info.color}"></div></div>
        <div class="bills-row">${activeBills.map(b=>`<span class="bill-chip">${info.symbol}${b.denom}×${b.count}</span>`).join("")}</div>
      </div>
    </div>`;
  }).join("");
}

function renderDetail() {
  const el = document.getElementById("detail");
  el.innerHTML = state.order.map(code => {
    const info = state.holdings[code];
    const amt = getTotal(code);
    const jpy = getTotalJPY(code);
    const existingDenoms = info.bills.map(b=>b.denom);
    const suggestDenoms = [1,2,5,10,20,50,100,200,500,1000].filter(d=>!existingDenoms.includes(d));

    const rows = info.bills.map((b,idx) => `
      <tr>
        <td class="denom-cell" style="color:${info.color}">${info.symbol}${b.denom}</td>
        <td>
          <div class="stepper">
            <button class="step-btn" onclick="stepCount('${code}',${idx},-1)">−</button>
            <input class="step-input" type="number" min="0" value="${b.count}" onchange="setCount('${code}',${idx},this.value)" oninput="setCount('${code}',${idx},this.value)">
            <button class="step-btn" onclick="stepCount('${code}',${idx},1)">＋</button>
          </div>
        </td>
        <td class="subtotal-cell">${info.symbol}${(b.denom*b.count).toLocaleString()}</td>
        <td><button class="action-btn danger" onclick="removeBill('${code}',${idx})">🗑</button></td>
      </tr>`).join("");

    const suggestBtns = suggestDenoms.slice(0,6).map(d=>
      `<button class="denom-btn" onclick="addBill('${code}',${d})">${info.symbol}${d}</button>`
    ).join("");

    return `<div class="currency-card" style="margin-bottom:16px;border-color:${info.color}33">
      <div class="section-header">
        <div style="display:flex;align-items:center;gap:8px">
          <span>${info.flag}</span>
          <span class="section-title" style="color:${info.color}">${code} — ${info.label}</span>
        </div>
        <div style="text-align:right">
          <div class="section-total">${info.symbol}${amt.toLocaleString()}</div>
          <div class="section-jpy">${jpy ? fmtJPY(jpy) : "—"}</div>
        </div>
      </div>
      <table class="bill-table">
        <thead><tr>
          <th>額面</th><th>枚数</th><th>小計</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="add-denom-section">
        <span class="add-denom-label">追加:</span>
        ${suggestBtns}
        <div class="denom-input-row">
          <input class="denom-custom-input" id="customDenom_${code}" type="number" placeholder="カスタム額面">
          <button class="confirm-btn" onclick="addCustomBill('${code}')">追加</button>
        </div>
      </div>
      <button class="delete-currency-btn" onclick="deleteCurrency('${code}')">🗑 ${info.label}（${code}）を削除</button>
    </div>`;
  }).join("");
}

function renderRates() {
  const el = document.getElementById("rates");
  el.innerHTML = `<div style="font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:16px;font-family:var(--font-mono)">1通貨 = 円レートを入力</div>` +
    state.order.map(code => {
      const info = state.holdings[code];
      const rate = state.rates[code] || "";
      const jpy = getTotalJPY(code);
      return `<div class="rate-card">
        <span class="rate-flag">${info.flag}</span>
        <span class="rate-code" style="color:${info.color}">${code}</span>
        <span class="rate-eq">1${info.symbol} =</span>
        <input class="rate-input" type="number" step="0.01" value="${rate ? fmtFX(rate) : ""}" placeholder="0.00"
          onchange="setRate('${code}',this.value)" oninput="setRate('${code}',this.value)">
        <span class="rate-jpy-label">JPY</span>
      </div>
      <div class="rate-result" style="margin:-6px 14px 10px;font-size:11px;color:var(--green);font-family:var(--font-mono)">
        → ${info.symbol}${getTotal(code).toLocaleString()} = ${jpy ? fmtJPY(jpy) : "—"}
      </div>`;
    }).join("") +
    `<div style="height:20px"></div>`;
}

// ===== ACTIONS =====
function stepCount(code, idx, delta) {
  const b = state.holdings[code].bills[idx];
  b.count = Math.max(0, b.count + delta);
  saveState();
  renderAll();
}

function setCount(code, idx, val) {
  state.holdings[code].bills[idx].count = Math.max(0, parseInt(val) || 0);
  saveState();
  renderAll();
}

function addBill(code, denom) {
  const bills = state.holdings[code].bills;
  if (bills.find(b => b.denom === denom)) return;
  bills.push({denom, count: 0});
  bills.sort((a,b) => a.denom - b.denom);
  saveState();
  renderAll();
  showToast(`${state.holdings[code].symbol}${denom} を追加`);
}

function addCustomBill(code) {
  const input = document.getElementById(`customDenom_${code}`);
  const denom = parseInt(input.value);
  if (!denom || denom <= 0) return;
  addBill(code, denom);
  input.value = "";
}

function removeBill(code, idx) {
  if (!confirm("この紙幣種を削除しますか？")) return;
  state.holdings[code].bills.splice(idx, 1);
  saveState();
  renderAll();
}

function setRate(code, val) {
  state.rates[code] = parseFloat(val) || 0;
  saveState();
  renderAll();
}

function deleteCurrency(code) {
  if (!confirm(`${state.holdings[code].label}（${code}）を削除しますか？`)) return;
  delete state.holdings[code];
  delete state.rates[code];
  state.order = state.order.filter(c => c !== code);
  saveState();
  renderAll();
  showToast(`${code} を削除しました`);
}

// ===== ADD CURRENCY =====
function openAddCurrency() {
  selectedColor = COLORS[Math.floor(Math.random() * COLORS.length)];

  // Suggest row
  const existing = state.order;
  const suggests = SUGGEST.filter(s => !existing.includes(s.code));
  document.getElementById("suggestRow").innerHTML = suggests.map(s =>
    `<button class="suggest-btn" onclick="fillSuggest('${s.code}','${s.label}','${s.symbol}','${s.flag}')">${s.flag} ${s.code}</button>`
  ).join("");

  // Color row
  document.getElementById("colorRow").innerHTML = COLORS.map(c =>
    `<div class="color-swatch${c===selectedColor?' selected':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`
  ).join("");

  document.getElementById("newCode").value = "";
  document.getElementById("newName").value = "";
  document.getElementById("newSymbol").value = "";
  document.getElementById("newFlag").value = "";
  document.getElementById("addModal").style.display = "flex";
}

function fillSuggest(code, label, symbol, flag) {
  document.getElementById("newCode").value = code;
  document.getElementById("newName").value = label;
  document.getElementById("newSymbol").value = symbol;
  document.getElementById("newFlag").value = flag;
}

function pickColor(c) {
  selectedColor = c;
  document.querySelectorAll(".color-swatch").forEach(el => {
    el.classList.toggle("selected", el.style.background === c || el.style.backgroundColor === c);
  });
}

function closeModal() {
  document.getElementById("addModal").style.display = "none";
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById("addModal")) closeModal();
}

function addCurrency() {
  const code = document.getElementById("newCode").value.trim().toUpperCase();
  const label = document.getElementById("newName").value.trim();
  const symbol = document.getElementById("newSymbol").value.trim();
  const flag = document.getElementById("newFlag").value.trim() || "🏳️";
  if (!code || !label || !symbol) { alert("コード・名前・記号は必須です"); return; }
  if (state.holdings[code]) { alert(`${code} は既に登録されています`); return; }
  state.holdings[code] = { label, symbol, flag, color: selectedColor, bills: [] };
  state.rates[code] = 0;
  state.order.push(code);
  saveState();
  closeModal();
  renderAll();
  showToast(`${code} を追加しました`);
  switchTab("detail");
}

// ===== TABS =====
function switchTab(tab) {
  currentTab = tab;
  ["dashboard","detail","rates"].forEach(t => {
    document.getElementById(t).style.display = t === tab ? "block" : "none";
    document.querySelector(`.tab:nth-child(${["dashboard","detail","rates"].indexOf(t)+1})`).classList.toggle("active", t===tab);
    const navBtn = document.getElementById(`nav-${t}`);
    if (navBtn) navBtn.classList.toggle("active", t===tab);
  });
}

// ===== UI HELPERS =====
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}
function showError(msg) {
  const el = document.getElementById("errorBar");
  el.textContent = msg;
  el.style.display = "block";
}
function hideError() {
  document.getElementById("errorBar").style.display = "none";
}

// ===== INIT =====
renderAll();
fetchRates();
</script>
</body>
</html>
